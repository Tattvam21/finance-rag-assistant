services:
  db:
    image: pgvector/pgvector:pg16
    container_name: finance_rag_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_rag}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-finance_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-finance_rag}
      OLLAMA_HOST: http://host.docker.internal:11434
      DB_BACKEND: postgres
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      NUM_CTX: ${NUM_CTX:-8192}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.45}
      GATE_MODEL: ${GATE_MODEL:-qwen3:8b}
      RETRIEVAL_STRATEGY: ${RETRIEVAL_STRATEGY:-hybrid}
      GATE_MODE: ${GATE_MODE:-merged}
      PLANNER_MODE: ${PLANNER_MODE:-auto}
      AS_OF_DATE: ${AS_OF_DATE:-2024-08-05}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgvector_data:
